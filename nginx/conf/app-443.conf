server {
  listen 443 ssl;
  http2 on;
  server_name app.solaroptimizer360.com;

  ssl_certificate     /etc/letsencrypt/live/app.solaroptimizer360.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.solaroptimizer360.com/privkey.pem;

  # Sentetik health
  location = /health {
    default_type application/json; access_log off;
    return 200 '{"status":"ok","app":"frontend"}';
  }

  # Next.js asset cache (opsiyonel ama iyi)
  location ^~ /_next/static/ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    proxy_pass http://solar_frontend:3000/_next/static/;
  }

  # Genel proxy
  location / {
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_pass http://solar_frontend:3000;
  }
}
