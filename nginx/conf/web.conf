# HTTP: ACME + HTTPS redirect
server {
    listen 80;
    server_name solaroptimizer360.com www.solaroptimizer360.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS: FE'ye proxy
server {
    listen 443 ssl;
    http2 on;
    server_name solaroptimizer360.com www.solaroptimizer360.com;

    ssl_certificate     /etc/letsencrypt/live/solaroptimizer360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solaroptimizer360.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://solar_frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
