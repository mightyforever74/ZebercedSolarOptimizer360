# 80: ACME + redirect
server {
  listen 80;
  server_name api.solaroptimizer360.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / { return 301 https://$host$request_uri; }
}

# 443: proxy
server {
  listen 443 ssl;
  http2 on;
  server_name api.solaroptimizer360.com;

  ssl_certificate     /etc/letsencrypt/live/api.solaroptimizer360.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.solaroptimizer360.com/privkey.pem;

  # Dedup: güvenlik başlıklarının kanonik kaynağı 00-global.conf
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Permissions-Policy;

  client_max_body_size 20m;
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # ACME passthrough (opsiyonel)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Health alias'ları (rate-limit uygulanmaz)
  location = /health {
    access_log off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://solar_backend:8000/api/health;
  }
  location = /healthz {
    access_log off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://solar_backend:8000/api/health;
  }

  # Genel trafik
  location / {
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    limit_req zone=apilimit burst=30 nodelay;
    limit_req_status 429;

    proxy_pass http://solar_backend:8000;
  }
}
