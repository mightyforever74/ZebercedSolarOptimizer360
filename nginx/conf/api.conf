# 443: proxy
server {
  listen 443 ssl;
  http2 on;
  server_name api.solaroptimizer360.com;

  ssl_certificate     /etc/letsencrypt/live/api.solaroptimizer360.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.solaroptimizer360.com/privkey.pem;

  # Dedup: güvenlik başlıklarının kanonik kaynağı 00-global.conf
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Permissions-Policy;

  # Upstream CORS'u gizle — CORS'u burada tekilleştiriyoruz
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Vary;

  # Kanonik CORS (yalnızca app origin)
  set $cors_origin "https://app.solaroptimizer360.com";
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
  add_header Vary "Origin" always;

  client_max_body_size 20m;
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # ACME passthrough
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Health alias'ları (rate-limit uygulanmaz)
  location = /health {
    if ($request_method = OPTIONS) { return 204; }
    access_log off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://solar_backend:8000/api/health;
  }
  location = /healthz {
    if ($request_method = OPTIONS) { return 204; }
    access_log off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://solar_backend:8000/api/health;
  }

  # Genel trafik
  location / {
    # Preflight'ı kısa devre (rate-limit'e takılmadan)
    if ($request_method = OPTIONS) {
      return 204;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    limit_req zone=apilimit burst=30 nodelay;
    limit_req_status 429;

    proxy_pass http://solar_backend:8000;
  }
}
