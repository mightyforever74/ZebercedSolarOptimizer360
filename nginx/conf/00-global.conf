# WebSocket/SSE için upgrade mapping (http scope)
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        close;
}

# IP başına istek hızı (10 istek/sn, burst 20)
limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

# Bilgi sızmasını engelle (nginx versiyonu vs)
server_tokens off;

# gzip (Alpine derlemesinde brotli yoksa gzip yeter)
gzip on; gzip_comp_level 6; gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# TLS sert ve temiz
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# Güvenlik başlıkları
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 429 yakalamak için bayrak
map $status $is_rate_limited { 429 1; default 0; }

# Zengin format (istek süreleri + upstream + RL)
log_format main_ext
  '$remote_addr - $remote_user [$time_local] '
  '"$request" $status $body_bytes_sent '
  'rt=$request_time urt=$upstream_response_time ust=$upstream_status '
  'xff="$http_x_forwarded_for" ua="$http_user_agent" '
  'rl=$is_rate_limited';

# Varsayılan access log
access_log /var/log/nginx/access.log main_ext;

# Sadece rate-limited istekler için ayrı log (çok faydalı)
access_log /var/log/nginx/access.ratelimited.log main_ext if=$is_rate_limited;
